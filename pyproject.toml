[project]
name = "uam-system-model"
version = "0.1.0"
description = "System analysis toolkit for UAM networks"
authors = [
    {name = "Albert Cao"}
]
license = {text = "BSD 3-Clause"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gurobipy>=12.0.2",
    "numpy_financial>=1.0.0",
    "geopy>=2.4.1",
    "pandas (>=3.0.1,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "geopandas (>=1.1.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
